name: Build lmi MIUI 4.19 SukiSU (NoSpoof)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'android14-stable-mod'
          submodules: recursive

      - name: Setup SukiSU builtin-new
        run: |
          curl -LSs "https://git.zako.shirkneko.top:20004/shirkneko/SukiSU/raw/branch/main/kernel/setup.sh" | bash -s builtin-new

      - name: Setup toolchain (Proton Clang)
        run: |
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.tar.gz
          tar -xf 20210522.tar.gz
          echo "$PWD/proton-clang-20210522/bin" >> $GITHUB_PATH

      - name: Build kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make lmi_stock-defconfig
          # 4.19 ARM64 自动跳过手动 hook（CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y 由 setup 或 defconfig 覆盖）
          make -j$(nproc) Image.gz dtbs

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/liyafe1997/AnyKernel3 --branch kona --single-branch
          cp arch/arm64/boot/Image.gz AnyKernel3/
          cp arch/arm64/boot/dts/qcom/*.dtb AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          zip -r ../Kernel_lmi_SukiSU_4.19_MIUI_nospoof_$(date +%Y%m%d).zip *
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: lmi_4.19_MIUI_SukiSU_nospoof
          path: "*.zip"
