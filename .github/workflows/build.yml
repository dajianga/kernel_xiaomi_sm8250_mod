name: Build lmi MIUI 4.19 SukiSU (NoSpoof)

on:
  workflow_dispatch:
  push:
    branches: [ android14-stable-mod ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: android14-stable-mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick libncurses5 libncurses5-dev \
            libssl-dev libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev libelf-dev \
            gcc-aarch64-linux-gnu

      - name: Setup SukiSU (SUSFS builtin-new)
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          rm -rf KernelSU
          for i in 1 2 3; do
            echo "=== 克隆 SukiSU-Ultra 第 $i 次 ==="
            git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU && break
            sleep 10
          done
          [ -d KernelSU ] || { echo "❌ 克隆失败"; exit 1; }
          ln -sfn "$PWD/KernelSU/kernel" drivers/kernelsu
          grep -q 'obj-\$(CONFIG_KSU)' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "✅ SukiSU 手动集成完成"
          ls drivers/kernelsu/

      - name: Setup Proton Clang
        run: |
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.tar.gz
          tar -xf 20210522.tar.gz
          ./proton-clang-20210522/bin/clang --version

      - name: Build kernel
        run: |
          set -e
          cp arch/arm64/configs/lmi_stock-defconfig arch/arm64/configs/lmi_stock_defconfig
          make ARCH=arm64 lmi_stock_defconfig

          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_SUSFS
          scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_UNAME
          scripts/config --disable CONFIG_CLK_QCOM_DEBUG 2>/dev/null || true
          scripts/config --disable CONFIG_CLK_DEBUG 2>/dev/null || true

          # binder stub
          sed -i '1i #include <linux/sched.h>' drivers/android/binder.c
          sed -i '2i static inline int is_critical_task(struct task_struct *t) { return 0; }' drivers/android/binder.c
          sed -i '3i static inline void set_inherit_top_app(struct task_struct *t, struct task_struct *f) {}' drivers/android/binder.c
          sed -i '4i static inline void restore_inherit_top_app(struct task_struct *t) {}' drivers/android/binder.c

          # audio
          sed -i 's/active_ch_cnt:%lu/active_ch_cnt:%lx/' techpack/audio/asoc/codecs/bolero/tx-macro.c 2>/dev/null || true
          sed -i 's/active_ch_cnt:%d/active_ch_cnt:%lx/' techpack/audio/asoc/codecs/bolero/tx-macro.c 2>/dev/null || true
          sed -i 's/with err %d/with err %ld/' drivers/char/adspprpc.c 2>/dev/null || true
          sed -i 's/int ret;/int ret = 0;/' techpack/audio/asoc/codecs/cs35141/vm_adsp.c 2>/dev/null || true
          sed -i 's/int port_idx;/int port_idx = 0;/' techpack/audio/dsp/q6adm.c 2>/dev/null || true

          # clk
          : > drivers/clk/qcom/clk-debug.c 2>/dev/null || true
          sed -i 's/^obj-y.*clk-debug.o/#&/' drivers/clk/qcom/Makefile 2>/dev/null || true
          sed -i 's/^obj-m.*clk-debug.o/#&/' drivers/clk/qcom/Makefile 2>/dev/null || true

          # binder stub (保留原有效补丁)
          sed -i '1i #include <linux/sched.h>' drivers/android/binder.c
          sed -i '2i static inline int is_critical_task(struct task_struct *t) { return 0; }' drivers/android/binder.c
          sed -i '3i static inline void set_inherit_top_app(struct task_struct *t, struct task_struct *f) {}' drivers/android/binder.c
          sed -i '4i static inline void restore_inherit_top_app(struct task_struct *t) {}' drivers/android/binder.c

          # audio (保留原有效补丁)
          sed -i 's/active_ch_cnt:%lu/active_ch_cnt:%lx/' techpack/audio/asoc/codecs/bolero/tx-macro.c 2>/dev/null || true
          sed -i 's/active_ch_cnt:%d/active_ch_cnt:%lx/' techpack/audio/asoc/codecs/bolero/tx-macro.c 2>/dev/null || true
          sed -i 's/with err %d/with err %ld/' drivers/char/adspprpc.c 2>/dev/null || true
          sed -i 's/int ret;/int ret = 0;/' techpack/audio/asoc/codecs/cs35141/vm_adsp.c 2>/dev/null || true
          sed -i 's/int port_idx;/int port_idx = 0;/' techpack/audio/dsp/q6adm.c 2>/dev/null || true

          # clk (保留原有效补丁，仅 clk-debug 清空，不动 camera trace)
          : > drivers/clk/qcom/clk-debug.c 2>/dev/null || true
          sed -i 's/^obj-y.*clk-debug.o/#&/' drivers/clk/qcom/Makefile 2>/dev/null || true
          sed -i 's/^obj-m.*clk-debug.o/#&/' drivers/clk/qcom/Makefile 2>/dev/null || true

          # ✅ 终极 Camera / Trace 修复（不清空任何头文件，仅 stub 调用点）
          # 1. 确保 cam_icp_hw_mgr.c 不破坏枚举，仅安全 stub 自身 trace
          CICP=techpack/camera/drivers/cam_icp/icp_hw/icp_hw_mgr/cam_icp_hw_mgr.c
          grep -q '#include "cam_context.h"' $CICP || sed -i '1i #include "cam_context.h"' $CICP
          sed -i '/^#define CAM_CTX_ACQUIRED/d' $CICP
          sed -i '/^#define trace_cam_icp_fw_dbg.*do {}/d' $CICP
          grep -q '#define trace_cam_icp_fw_dbg(a, b) do {} while (0)' $CICP || \
            sed -i '1i #define trace_cam_icp_fw_dbg(a, b) do {} while (0)' $CICP
          sed -i 's/cam_context_buf_done_from_hw(ctx,/cam_context_buf_done_from_hw((struct cam_context *)ctx,/' techpack/camera/drivers/cam_cust/cam_custom_context.c 2>/dev/null || true

          # 2. ✅ 直接注释掉 cam_fd_context.c 中的 trace_cam_context_state 调用（根治链接错误）
          FDCTX=techpack/camera/drivers/cam_fd/cam_fd_context.c
          if [ -f "$FDCTX" ]; then
            sed -i 's/^[[:space:]]*trace_cam_context_state(.*);/\/\/ &/' "$FDCTX"
          fi

          # 3. 其他历史路径/头文件补丁（保留）
          sed -i 's|#include "cam_cci_dev.h"|#include "../cam_cci/cam_cci_dev.h"|g' \
            techpack/camera/drivers/cam_sensor_module/cam_sensor_io/cam_sensor_i2c.h 2>/dev/null || true
          grep -q 'ccflags-y.*-I\$(srctree)/\$(src)' techpack/camera/drivers/cam_sensor_module/cam_cci/Makefile 2>/dev/null || \
            echo 'ccflags-y += -I$(srctree)/$(src)' >> techpack/camera/drivers/cam_sensor_module/cam_cci/Makefile 2>/dev/null || true
          printf '#ifndef CAM_REQ_MGR_CORE_STUB_H\n#define CAM_REQ_MGR_CORE_STUB_H\nstruct cam_req_mgr_core_device;\n#endif\n' >> techpack/camera/drivers/cam_req_mgr/cam_req_mgr_core.h 2>/dev/null || true

          # IPA / debugfs / thread_info 兜底
          scripts/config --disable CONFIG_IPA_V3 2>/dev/null || true
          scripts/config --disable CONFIG_IPA_DEBUGFS 2>/dev/null || true
          scripts/config --disable CONFIG_DEBUG_FS 2>/dev/null || true
          sed -i 's/__bad_copy_to();/do {} while (0);/' include/linux/thread_info.h 2>/dev/null || true

          # 工具链
          export PATH="$PWD/proton-clang-20210522/bin:$PATH"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-w"

          echo "===== 关键配置自检 ====="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_IPA|CONFIG_DEBUG_FS" .config | sort -u || true
          echo "======================="

          # ✅ 编译（确保上述补丁全生效后再 make）
          make ARCH=arm64 -j$(nproc) Image.gz
          make ARCH=arm64 -j$(nproc) arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb || true

          # 合成 Image.gz-dtb
          if [ -f arch/arm64/boot/Image.gz ] && [ -f arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb ]; then
            cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb > arch/arm64/boot/Image.gz-dtb
            echo "✅ 已合成 Image.gz-dtb"
          else
            echo "⚠️ 未找到 dtb，仅使用 Image.gz"
          fi
          echo "✅ build done"

      - name: Package AnyKernel3
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md .github
          if [ -f ../arch/arm64/boot/Image.gz-dtb ]; then
            cp ../arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../arch/arm64/boot/Image.gz ]; then
            cp ../arch/arm64/boot/Image.gz .
          else
            echo "❌ 内核镜像未生成，打包终止"
            exit 1
          fi
          [ -f ../arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb ] && \
            cp ../arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb ./dtb
          sed -i 's/^kernel.string=.*/kernel.string=lmi-SukiSU-Ultra-4.19-MIUI-NoSpoof/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          zip -r9 ../Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip . -x '*placeholder'
          cd ..
          ls -lh Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip
          [ -s Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip ] || exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_lmi_SukiSU_4.19_MIUI_nospoof
          path: Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip
          if-no-files-found: error
          
