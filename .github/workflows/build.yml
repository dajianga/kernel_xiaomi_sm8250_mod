name: Build lmi MIUI 4.19 SukiSU (NoSpoof)

on:
  workflow_dispatch:
  push:
    branches: [ android14-stable-mod ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: android14-stable-mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick libncurses5 libncurses5-dev \
            libssl-dev libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev libelf-dev \
            gcc-aarch64-linux-gnu

      - name: Setup SukiSU (SUSFS builtin-new)
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          rm -rf KernelSU
          for i in 1 2 3; do
            echo "=== 克隆 SukiSU-Ultra 第 $i 次 ==="
            git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU && break
            sleep 10
          done
          [ -d KernelSU ] || { echo "❌ 克隆失败"; exit 1; }
          ln -sfn "$PWD/KernelSU/kernel" drivers/kernelsu
          grep -q 'obj-\$(CONFIG_KSU)' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "✅ SukiSU 手动集成完成"
          ls drivers/kernelsu/

      - name: Setup Proton Clang
        run: |
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.tar.gz
          tar -xf 20210522.tar.gz
          ./proton-clang-20210522/bin/clang --version

      - name: Build kernel
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/proton-clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-

          # ===== 关键配置（不关 DEBUG_FS） =====
          scripts/config --disable CONFIG_IPA_V3 2>/dev/null || true
          scripts/config --disable CONFIG_IPA_DEBUGFS 2>/dev/null || true
          scripts/config --disable CONFIG_DEBUG_CC 2>/dev/null || true
          scripts/config --disable CONFIG_CLK_QCOM_DEBUGCC 2>/dev/null || true
          scripts/config --disable CONFIG_CLK_QCOM_UEBUG 2>/dev/null || true

          # ===== binder stub =====
          BINDER=drivers/android/binder.c
          [ -f "$BINDER" ] || BINDER=techpack/android/binder.c
          if [ -f "$BINDER" ]; then
            sed -i '/^static inline int is_critical_task/d' "$BINDER"
            sed -i '/^static inline void set_inherit_top_app/d' "$BINDER"
            sed -i '/^static inline void restore_inherit_top_app/d' "$BINDER"
            sed -i '/^#ifndef is_critical_task/,/^#endif/d' "$BINDER"
            sed -i '/^#ifndef set_inherit_top_app/,/^#endif/d' "$BINDER"
            sed -i '/^#ifndef restore_inherit_top_app/,/^#endif/d' "$BINDER"
            sed -i '/__BINDER_STUB_FUNCS/d' "$BINDER"
            if ! grep -q "^int is_critical_task" "$BINDER"; then
              {
                echo '#ifndef __BINDER_STUB_FUNCS'
                echo '#define __BINDER_STUB_FUNCS'
                echo '#include <linux/sched.h>'
                echo 'int is_critical_task(struct task_struct *t) { return 0; }'
                echo 'void set_inherit_top_app(struct task_struct *t, struct task_struct *f) {}'
                echo 'void restore_inherit_top_app(struct task_struct *t) {}'
                echo '#endif'
                echo ''
                cat "$BINDER"
              } > "$BINDER.tmp" && mv "$BINDER.tmp" "$BINDER"
              echo "✅ binder stub 已注入"
            fi
          fi

          # ===== audio 格式符修复 =====
          sed -i 's/active_ch_cnt:%lu/active_ch_cnt:%lx/' techpack/audio/asoc/codecs/bolero/tx-macro.c 2>/dev/null || true
          sed -i 's/active_ch_cnt:%d/active_ch_cnt:%lx/' techpack/audio/asoc/codecs/bolero/tx-macro.c 2>/dev/null || true
          sed -i 's/with err %d/with err %ld/' drivers/char/adspprpc.c 2>/dev/null || true
          sed -i 's/int ret;/int ret = 0;/' techpack/audio/asoc/codecs/cs35141/vm_adsp.c 2>/dev/null || true
          sed -i 's/int port_idx;/int port_idx = 0;/' techpack/audio/dsp/q6adm.c 2>/dev/null || true

          # ===== clk-debug / uebug / debugcc 空实现兜底（不删对象，防引用断链） =====
          cat > drivers/clk/qcom/clk-uebug.c <<'EOF'
          #include <linux/clk-provider.h>
          #include <linux/module.h>
          const struct clk_ops clk_uebug_mux_ops = {};
          int clk_uebug_measure_add(struct clk *clk, void *data) { return 0; }
          EXPORT_SYMBOL(clk_uebug_mux_ops);
          EXPORT_SYMBOL(clk_uebug_measure_add);
          EOF
          cat > drivers/clk/qcom/clk-debug.c <<'EOF'
          #include <linux/clk-provider.h>
          #include <linux/io.h>
          #include <linux/module.h>
          #include <linux/platform_device.h>
          const struct clk_ops clk_debug_mux_ops = {};
          void __iomem *map_debug_bases(struct platform_device *pdev, const char *name, int index) { return NULL; }
          int clk_debug_measure_register(struct clk_hw *hw) { return 0; }
          EXPORT_SYMBOL(clk_debug_mux_ops);
          EXPORT_SYMBOL(map_debug_bases);
          EXPORT_SYMBOL(clk_debug_measure_register);
          EOF
          cat > drivers/clk/qcom/debugcc-kona.c <<'EOF'
          #include <linux/init.h>
          #include <linux/module.h>
          static int __init debugcc_kona_init(void) { return 0; }
          static void __exit debugcc_kona_exit(void) {}
          module_init(debugcc_kona_init);
          module_exit(debugcc_kona_exit);
          MODULE_LICENSE("GPL");
          EOF
          sed -i -E 's/^#[[:space:]]*(obj-y|obj-m)[[:space:]]*\+?=[^#]*(clk-debug|clk-uebug|debugcc-kona)/\1/' drivers/clk/qcom/Makefile 2>/dev/null || true
          grep -q 'clk-uebug.o' drivers/clk/qcom/Makefile || echo 'obj-y += clk-uebug.o' >> drivers/clk/qcom/Makefile
          grep -q 'clk-debug.o' drivers/clk/qcom/Makefile || echo 'obj-y += clk-debug.o' >> drivers/clk/qcom/Makefile
          grep -q 'debugcc-kona.o' drivers/clk/qcom/Makefile || echo 'obj-y += debugcc-kona.o' >> drivers/clk/qcom/Makefile

          # ===== trace 头空宏 =====
          cat > drivers/clk/qcom/trace.h <<'EOF'
          #ifndef __CLK_QCOM_TRACE_H
          #define __CLK_QCOM_TRACE_H
          #define trace_clk_branch(...) do { } while (0)
          #define trace_clk_set_rate(...) do { } while (0)
          #define trace_clk_enable(...) do { } while (0)
          #define trace_clk_disable(...) do { } while (0)
          #endif
          EOF
          cat > techpack/display/pll/pll_trace.h <<'EOF'
          #ifndef __PLL_TRACE_H
          #define __PLL_TRACE_H
          #define trace_mddss_pll_enable(...) do { } while (0)
          #define trace_mddss_pll_disable(...) do { } while (0)
          #define trace_mddss_pll_set_rate(...) do { } while (0)
          #define trace_mdss_pll_lock_start(...) do { } while (0)
          #define trace_mdss_pll_lock_end(...) do { } while (0)
          #define MDSS_PLL_ATRACE_BEGIN(...) do { } while (0)
          #define MDSS_PLL_ATRACE_END(...) do { } while (0)
          #endif
          EOF
          cat > drivers/hid/hid-trace.h <<'EOF'
          #ifndef __HID_TRACE_H
          #define __HID_TRACE_H
          #endif
          EOF

          # ===== trace 调用点注释 =====
          QVR=drivers/hid/hid-qvr.c
          if [ -f "$QVR" ]; then
            sed -i 's/[[:space:]]*trace_qvr_recv_sensor(.*);/\/\/ &/' "$QVR"
            sed -i 's/[[:space:]]*trace_qvr_send_package(.*);/\/\/ &/' "$QVR"
          fi
          for f in techpack/display/pll/*.c drivers/clk/qcom/*.c; do
            [ -f "$f" ] || continue
            sed -i 's/[[:space:]]*MDSS_PLL_ATRACE_BEGIN(.*);/\/\/ &/' "$f"
            sed -i 's/[[:space:]]*MDSS_PLL_ATRACE_END(.*);/\/\/ &/' "$f"
            sed -i 's/[[:space:]]*trace_mdss_pll_.*(.*);/\/\/ &/' "$f"
            sed -i 's/[[:space:]]*trace_mddss_pll_.*(.*);/\/\/ &/' "$f"
          done
          grep -rl --include='*.c' --include='*.h' \
            -e 'trace_cam_icp_fw_dbg' -e 'trace_cam_context_state' -e 'trace_cam_req_mgr_pkt' \
            techpack/camera 2>/dev/null | while read -r f; do
            sed -i 's/[[:space:]]*trace_cam_icp_fw_dbg(.*);/\/\/ &/' "$f"
            sed -i 's/[[:space:]]*trace_cam_context_state(.*);/\/\/ &/' "$f"
            sed -i 's/[[:space:]]*trace_cam_req_mgr_pkt(.*);/\/\/ &/' "$f"
          done
          CICP=techpack/camera/drivers/cam_icp/icp_hw/icp_hw_mgr/cam_icp_hw_mgr.c
          if [ -f "$CICP" ]; then
            grep -q '#include "cam_context.h"' "$CICP" || sed -i '1i #include "cam_context.h"' "$CICP"
            sed -i '/^#define trace_cam_icp_fw_dbg/d' "$CICP"
            sed -i '/^#define CAM_CTX_ACQUIRED/d' "$CICP"
          fi
          sed -i 's/cam_context_buf_done_from_hw(ctx,/cam_context_buf_done_from_hw((struct cam_context *)ctx,/' \
            techpack/camera/drivers/cam_cust/cam_custom_context.c 2>/dev/null || true

          # ===== cam_req_mgr_core.h 路径修复 =====
          CORE_H=techpack/camera/drivers/cam_req_mgr/cam_req_mgr_core.h
          if [ ! -f "$CORE_H" ]; then
            cat > "$CORE_H" <<'EOF'
          #ifndef CAM_REQ_MGR_CORE_H
          #define CAM_REQ_MGR_CORE_H
          struct cam_req_mgr_core_device;
          struct cam_req_mgr_core_ctx;
          #endif
          EOF
          fi
          CAM_TRACE=techpack/camera/drivers/cam_utils/cam_trace.h
          if [ -f "$CAM_TRACE" ]; then
            sed -i 's|#include "cam_req_mgr_core.h"|#include "../cam_req_mgr/cam_req_mgr_core.h"|g' "$CAM_TRACE"
            sed -i 's|#include <cam_req_mgr_core.h>|#include "../cam_req_mgr/cam_req_mgr_core.h"|g' "$CAM_TRACE"
          fi
          for mkf in techpack/camera/drivers/cam_utils/Makefile techpack/camera/drivers/cam_req_mgr/Makefile; do
            [ -f "$mkf" ] && grep -q 'ccflags-y.*cam_req_mgr' "$mkf" || \
              echo 'ccflags-y += -I$(srctree)/$(src)/../cam_req_mgr' >> "$mkf" 2>/dev/null || true
          done

          # ===== cam_cci_dev.h 路径修复 =====
          sed -i 's|#include "cam_cci_dev.h"|#include "../cam_cci/cam_cci_dev.h"|g' \
            techpack/camera/drivers/cam_sensor_module/cam_sensor_io/cam_sensor_i2c.h 2>/dev/null || true
          grep -q 'ccflags-y.*-I\$(srctree).*cam_cci' techpack/camera/drivers/cam_sensor_module/cam_cci/Makefile 2>/dev/null || \
            echo 'ccflags-y += -I$(srctree)/$(src)' >> techpack/camera/drivers/cam_sensor_module/cam_cci/Makefile 2>/dev/null || true

          # ===== IPA __bad_copy_to 兜底 =====
          sed -i 's/__bad_copy_to();/do {} while (0);/' include/linux/thread_info.h 2>/dev/null || true

          # ===== 配置自检 =====
          echo "===== 关键配置自检 ====="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_IPA|CONFIG_CLK_QCOM_UEBUG" .config | sort -u || true
          echo "======================="

          # ===== 正式编译 =====
          make ARCH=arm64 -j$(nproc) Image.gz
          make ARCH=arm64 -j$(nproc) arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb || true

          # ===== 合成 Image.gz-dtb =====
          if [ -f arch/arm64/boot/Image.gz ] && [ -f arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb ]; then
            cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb > arch/arm64/boot/Image.gz-dtb
            echo "✅ 已合成 Image.gz-dtb ($(du -h arch/arm64/boot/Image.gz-dtb | cut -f1))"
          else
            echo "⚠️ 未找到 dtb，仅使用 Image.gz"
          fi
          echo "✅ build done"


      - name: Package AnyKernel3
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md .github
          if [ -f ../arch/arm64/boot/Image.gz-dtb ]; then
            cp ../arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../arch/arm64/boot/Image.gz ]; then
            cp ../arch/arm64/boot/Image.gz .
          else
            echo "❌ 内核镜像未生成，打包终止"
            exit 1
          fi
          [ -f ../arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb ] && \
            cp ../arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb ./dtb
          sed -i 's/^kernel.string=.*/kernel.string=lmi-SukiSU-Ultra-4.19-MIUI-NoSpoof/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          zip -r9 ../Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip . -x '*placeholder'
          cd ..
          ls -lh Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip
          [ -s Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip ] || exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_lmi_SukiSU_4.19_MIUI_nospoof
          path: Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip
          if-no-files-found: error
