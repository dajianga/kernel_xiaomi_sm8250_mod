name: Build lmi MIUI 4.19 SukiSU (NoSpoof)

on:
  push:
    branches: [ android14-stable-mod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libncurses-dev zip curl git wget cpio python3

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git -b 20210522 proton-clang-20210522

      - name: Setup SukiSU
        run: |
          rm -rf KernelSU
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          ln -sfn KernelSU drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git

      - name: Build kernel
        run: |
          export PATH="$PWD/proton-clang-20210522/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export DTC_FLAGS="-f"

          cp arch/arm64/configs/lmi_stock-defconfig arch/arm64/configs/lmi_stock_defconfig
          make lmi_stock_defconfig

          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_SUSFS
          scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_UNAME
          scripts/config --enable CONFIG_SCHED_TOP_APP   # ← 本轮关键

          make -j$(nproc) Image.gz
          make -j$(nproc) arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb || true

      - name: Package AnyKernel3
        run: |
          cd AnyKernel3
          cp ../arch/arm64/boot/Image.gz .
          cp ../arch/arm64/boot/dts/vendor/qcom/*.dtb . 2>/dev/null || true
          zip -r9 ../Kernel_lmi_SukiSU_4.19_MIUI_nospoof_$(date +%Y%m%d).zip * -x .git README.md *placeholder
          cd ..
          mv Kernel_lmi_SukiSU_4.19_MIUI_nospoof_*.zip AnyKernel3/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_lmi_SukiSU_4.19_MIUI_nospoof
          path: AnyKernel3/*.zip
