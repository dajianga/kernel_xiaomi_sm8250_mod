name: Build lmi MIUI 4.19 SukiSU (NoSpoof)

on:
  workflow_dispatch:
  push:
    branches: [ android14-stable-mod ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: android14-stable-mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick libncurses5 libncurses5-dev \
            libssl-dev libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev libelf-dev \
            gcc-aarch64-linux-gnu python-is-python3

      # ---------- SukiSU：必须用官方脚本，软链才是相对路径 ----------
      - name: Setup SukiSU (builtin branch, SUSFS + KPM)
        run: |
          git config --global http.version HTTP/1.1
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin
          echo "--- drivers/kernelsu -> $(readlink drivers/kernelsu)"
          ls -l drivers/kernelsu/ | head
          grep -n 'kernelsu' drivers/Makefile drivers/Kconfig
          echo "--- SUSFS 符号是否存在 ---"
          grep -rn 'config KSU_SUSFS' drivers/kernelsu/ | head

      - name: Setup Proton Clang
        run: |
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.tar.gz
          tar -xf 20210522.tar.gz
          ./proton-clang-20210522/bin/clang --version

      - name: Build kernel
        run: |
          set -e
          export PATH="$PWD/proton-clang-20210522/bin:$PATH"
          export LC_ALL=C LANG=C

          # ===== 工具链：Clang + GNU 交叉组合，修掉 -mlittle-endian =====
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTAR=ar
          export HOSTLD=ld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_COMPILER_STRING="Proton Clang 20210522"
          export DTC_FLAGS="-f"
          # 只降级具体警告，不用 -w，避免掩盖真错误
          export KCFLAGS="-Wno-error=maybe-uninitialized -Wno-error=uninitialized \
            -Wno-error=format -Wno-error=format-security -Wno-error=format-truncation \
            -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types \
            -Wno-error=misleading-indentation -Wno-error=unused-result \
            -Wno-error=attribute-warning -Wno-error=sizeof-pointer-memaccess \
            -Wno-error=unused-variable -Wno-error=unused-but-set-variable"
          export KCPPFLAGS="$KCFLAGS"

          cp arch/arm64/configs/lmi_stock-defconfig arch/arm64/configs/lmi_stock_defconfig
          make O=out ARCH=arm64 lmi_stock_defconfig

          # ===== 依赖必须先开，否则 CONFIG_KSU 会被 Kconfig 静默丢弃 =====
          scripts/config --file out/.config --enable CONFIG_KPROBES
          scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
          scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
          scripts/config --file out/.config --enable CONFIG_EXT4_FS
          scripts/config --file out/.config --enable CONFIG_MODULES
          scripts/config --file out/.config --enable CONFIG_KALLSYMS
          scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SPOOF_UNAME
          scripts/config --file out/.config --enable CONFIG_KPM
          # IPA 老驱动与新版 uaccess 检查冲突，整块关掉（联网回落通用路径）
          scripts/config --file out/.config --disable CONFIG_IPA
          scripts/config --file out/.config --disable CONFIG_IPA_V3
          scripts/config --file out/.config --disable CONFIG_IPA_DEBUGFS
          scripts/config --file out/.config --disable CONFIG_CLK_QCOM_DEBUG
          scripts/config --file out/.config --disable CONFIG_CLK_DEBUG

          make O=out ARCH=arm64 -j"$(nproc)" olddefconfig
          echo "===== 关键配置自检（空则后面一定没 root） ====="
          grep -E 'CONFIG_(KSU|KSU_SUSFS|KPM|KPROBES|EXT4_FS|KALLSYMS)=' out/.config

          # ===== 只做「纯追加、不改语义」的兼容补丁 =====
          # binder: MIUI top-app 桩，避免 implicit declaration
          if ! grep -q 'ksu_topapp_compat_h' drivers/android/binder.c; then
            sed -i '1i #ifndef ksu_topapp_compat_h\n#define ksu_topapp_compat_h\n#include <linux/sched.h>\nstatic inline int is_critical_task(struct task_struct *t) { return 0; }\nstatic inline void set_inherit_top_app(struct task_struct *t, struct task_struct *f) {}\nstatic inline void restore_inherit_top_app(struct task_struct *t) {}\n#endif\n' \
              drivers/android/binder.c
          fi

          # trace 头缺失：仅当文件不存在时建空壳，绝不覆盖已有的真 trace 头
          for f in drivers/clk/qcom/trace.h \
                   techpack/display/pll/pll_trace.h \
                   techpack/camera/drivers/cam_utils/cam_trace.h \
                   drivers/hid/hid-trace.h \
                   techpack/camera/drivers/cam_icp/icp_hw/icp_hw_mgr/trace.h; do
            [ -e "$f" ] || { mkdir -p "$(dirname "$f")"; echo '/* auto-generated empty trace stub */' > "$f"; }
          done

          # cam_req_mgr_core.h：仅追加前置声明，不动原内容
          f=techpack/camera/drivers/cam_req_mgr/cam_req_mgr_core.h
          if [ -f "$f" ] && ! grep -q 'CAM_REQ_MGR_COMPAT_FWD' "$f"; then
            sed -i '1i #ifndef CAM_REQ_MGR_COMPAT_FWD\n#define CAM_REQ_MGR_COMPAT_FWD\nstruct cam_req_mgr_core_device;\nstruct cam_context;\n#endif\n' "$f"
          fi

          # ===== 编译：Image.gz + 全部 dtb，再合成 Image.gz-dtb =====
          make O=out ARCH=arm64 -j"$(nproc)" Image.gz
          make O=out ARCH=arm64 -j"$(nproc)" dtbs

          IMG=out/arch/arm64/boot/Image.gz
          [ -s "$IMG" ] || { echo "❌ Image.gz 缺失"; exit 1; }

          DTB=out/arch/arm64/boot/kona-v2.1-xrsrku4.dtb
          if [ -f "$DTB" ]; then
            cat "$IMG" "$DTB" > out/arch/arm64/boot/Image.gz-dtb
            echo "✅ 已合成 Image.gz-dtb（含 kona dtb）"
          else
            cp "$IMG" out/arch/arm64/boot/Image.gz-dtb
            echo "⚠️ 未找到 kona dtb，仅打包 Image.gz（AK3 会回退原 dtb）"
          fi

          echo "=== 产物 ==="
          ls -lh out/arch/arm64/boot/Image.gz*

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -rf .git

          cp ../out/arch/arm64/boot/Image.gz-dtb .
          # 单独 dtb 也放一份，兼容不同 AK3 脚本分支
          cp ../out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1-xrsrku4.dtb ./dtb 2>/dev/null || true

          sed -i 's/^kernel.string=.*/kernel.string=lmi-SukiSU-Ultra-4.19-MIUI-NoSpoof by Yuanbao/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          grep -q '^block=' anykernel.sh || echo 'block=/dev/block/bootdevice/by-name/boot' >> anykernel.sh

          echo "SukiSU-Ultra builtin + SUSFS 1.5.x + KPM, NoSpoof" > version
          echo "--- 包内容 ---"
          ls -lh
          zip -r9 ../Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip . -x README.md '*placeholder'
          cd ..
          ls -lh Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_lmi_SukiSU_4.19_MIUI_nospoof
          path: Kernel_lmi_SukiSU_4.19_MIUI_nospoof.zip
          if-no-files-found: error
